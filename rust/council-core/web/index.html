<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Council</title>
<style>
  :root {
    --bg: #101418; --panel: #1a2027; --line: #2a323c; --text: #e6ebf0; --dim: #8b98a5;
    --you: #3b82f6; --gpt: #10a37f; --claude: #d97757; --gemini: #4e8cf0; --grok: #9aa4b2;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.6 -apple-system, "Apple SD Gothic Neo", sans-serif;
         display: flex; flex-direction: column; height: 100dvh; }
  header { padding: 10px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  header h1 { font-size: 16px; }
  header .meta { color: var(--dim); font-size: 12.5px; }
  header .buttons { margin-left: auto; display: flex; gap: 6px; }
  header .buttons button { background: var(--panel); border: 1px solid var(--line); padding: 4px 12px; border-radius: 8px; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 78%; padding: 9px 13px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); white-space: pre-wrap; }
  .msg .who { font-size: 11.5px; font-weight: 700; margin-bottom: 3px; letter-spacing: .02em; }
  .msg .who .model { color: var(--dim); font-weight: 400; margin-left: 6px; }
  .msg.you { align-self: flex-end; background: #1d3a63; border-color: #2c507f; }
  .who.You { color: var(--you); } .who.GPT { color: var(--gpt); } .who.Claude { color: var(--claude); }
  .who.Gemini { color: var(--gemini); } .who.Grok { color: var(--grok); }
  .trace { align-self: stretch; color: var(--dim); font: 11.5px/1.7 ui-monospace, monospace;
           border-left: 2px solid var(--line); padding: 2px 10px; white-space: pre-line; }
  .trace .reason { color: #6d7a87; padding-left: 14px; }
  #busy { display: none; align-self: flex-start; color: var(--dim); font-size: 13px; padding: 4px 2px; }
  #busy.on { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .chip { border: 1px solid var(--line); background: var(--panel); border-radius: 20px; padding: 2px 10px; font-size: 12px; }
  .chip.REQUEST { border-color: #2c507f; } .chip.PASS { opacity: .6; }
  #error { display: none; margin: 0 16px; padding: 8px 12px; border-radius: 8px; background: #4a1d1d; border: 1px solid #7f2c2c; font-size: 13px; }
  footer { border-top: 1px solid var(--line); padding: 10px 16px 14px; display: flex; flex-direction: column; gap: 8px; }
  #composer { display: flex; gap: 8px; }
  #target { background: var(--panel); border: 1px solid var(--line); color: var(--text); border-radius: 10px; padding: 0 8px; font: inherit; }
  #text { flex: 1; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; color: var(--text);
          padding: 10px 12px; font: inherit; resize: none; height: 44px; }
  button { background: #2b4c7e; color: #fff; border: 0; border-radius: 10px; padding: 0 18px; font: inherit; cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  #stop { display: none; background: #7f2c2c; }
  #stop.on { display: block; }
  #ratebar { display: flex; gap: 6px; align-items: center; color: var(--dim); font-size: 12.5px; flex-wrap: wrap; }
  #ratebar button { background: var(--panel); border: 1px solid var(--line); color: var(--text); padding: 3px 11px; border-radius: 8px; }
  #ratebar button.sel { background: #2b4c7e; border-color: #2b4c7e; }
  #metrics { color: var(--dim); font-size: 12px; }
  .drawer { display: none; position: fixed; top: 0; right: 0; bottom: 0; width: 380px; max-width: 94vw;
            background: var(--panel); border-left: 1px solid var(--line); padding: 16px; overflow-y: auto; z-index: 10; }
  .drawer.open { display: block; }
  .drawer h2 { font-size: 14px; margin: 4px 0 10px; }
  .seat { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
  .seat .top { display: flex; align-items: center; gap: 8px; }
  .seat .dot { width: 8px; height: 8px; border-radius: 50%; background: #555; flex: none; }
  .seat .dot.ok { background: #34c759; } .seat .dot.bad { background: #e0524d; }
  .seat .hint { font-size: 11.5px; color: var(--dim); margin-top: 4px; }
  .seat .row { display: flex; gap: 6px; margin-top: 7px; }
  .seat input[type=text], .seat select, .opts input { background: var(--bg); border: 1px solid var(--line);
       color: var(--text); border-radius: 7px; padding: 5px 8px; font-size: 12.5px; min-width: 0; }
  .seat input[type=text], .seat select { flex: 1; }
  .opts { display: flex; align-items: center; gap: 8px; margin: 10px 0; font-size: 13px; color: var(--dim); flex-wrap: wrap; }
  .opts input { width: 80px; }
  #usage { width: 100%; border-collapse: collapse; font-size: 11.5px; color: var(--dim); margin: 6px 0 14px; }
  #usage td, #usage th { border-top: 1px solid var(--line); padding: 4px 6px; text-align: right; }
  #usage th:first-child, #usage td:first-child { text-align: left; }
  .wide { width: 100%; padding: 10px; margin-top: 6px; }
  .session { border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; margin-bottom: 8px; cursor: pointer; }
  .session:hover { background: #202834; }
  .session .name { font-size: 12.5px; }
  .session .sub { font-size: 11.5px; color: var(--dim); margin-top: 2px; }
  #viewer { display: none; position: fixed; inset: 24px; background: var(--bg); border: 1px solid var(--line);
            border-radius: 12px; z-index: 20; padding: 16px; overflow-y: auto; }
  #viewer.open { display: block; }
  #viewer .bar { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; }
  #viewer .bar .name { color: var(--dim); font-size: 12.5px; flex: 1; }
</style>
</head>
<body>
<header>
  <h1>AI Council</h1>
  <span class="meta" id="who"></span>
  <span class="meta" id="file"></span>
  <div class="buttons">
    <button id="history">기록</button>
    <button id="gear">설정</button>
  </div>
</header>
<div id="log"></div>
<div id="error"></div>
<footer>
  <div id="busy"></div>
  <div id="composer">
    <select id="target"><option value="">전체에게</option></select>
    <textarea id="text" placeholder="메시지를 입력하고 Enter (Shift+Enter 줄바꿈)"></textarea>
    <button id="send">보내기</button>
    <button id="stop">중단</button>
  </div>
  <div id="ratebar">
    <span>자연스러움</span>
    <button data-s="1">1</button><button data-s="2">2</button><button data-s="3">3</button>
    <button data-s="4">4</button><button data-s="5">5</button>
    <span id="metrics"></span>
  </div>
</footer>

<aside id="settings" class="drawer">
  <h2>참가자 구성</h2>
  <div id="seats"></div>
  <div class="opts">AI 연속발언 상한 <input id="streak" type="number" min="1" max="10" value="3"></div>
  <button id="apply" class="wide">새 세션 시작</button>
  <h2 style="margin-top:18px">세션 예산 (0 = 무제한)</h2>
  <div class="opts">비용 $ <input id="budget-cost" type="number" min="0" step="0.5" value="0">
       토큰 <input id="budget-tokens" type="number" min="0" step="100000" value="0"></div>
  <button id="budget-apply" class="wide">예산 적용</button>
  <h2 style="margin-top:18px">이번 세션 사용량</h2>
  <table id="usage"><thead><tr><th>AI</th><th>호출</th><th>입력</th><th>출력</th><th>비용$</th></tr></thead><tbody></tbody></table>
  <div class="seat hint" style="border:0;padding:0">잔여 한도는 CLI가 노출하지 않아 표시하지 못한다. 한도 초과 시 대화가 fail-closed로 멈추고 오류에 재설정 시각이 표시된다. 로그인은 터미널에서: codex login · claude /login · grok login · Antigravity 앱 로그인</div>
</aside>

<aside id="histdrawer" class="drawer">
  <h2>지난 세션</h2>
  <div id="sessions"></div>
</aside>

<div id="viewer">
  <div class="bar">
    <span class="name" id="viewer-name"></span>
    <button id="resume">이 대화 이어가기</button>
    <button id="viewer-close" style="background:var(--panel);border:1px solid var(--line)">닫기</button>
  </div>
  <div id="viewer-log" style="display:flex;flex-direction:column;gap:10px"></div>
</div>

<script>
const log = document.getElementById('log'), text = document.getElementById('text'),
      send = document.getElementById('send'), busy = document.getElementById('busy'),
      errBox = document.getElementById('error'), settings = document.getElementById('settings'),
      histdrawer = document.getElementById('histdrawer'), viewer = document.getElementById('viewer'),
      stopBtn = document.getElementById('stop'), target = document.getElementById('target');
let lastCount = -1, lastCycles = -1, wasBusy = false, viewerFile = null, MODELS = {};

const SEATS = [
  { id: 'gpt',    name: 'GPT',    models: ['gpt-5.3-codex', 'gpt-5.4'], hint: 'Codex CLI · ChatGPT 구독' },
  { id: 'claude', name: 'Claude', models: ['sonnet', 'opus', 'haiku'], hint: 'Claude Code CLI · claude.ai 구독', noEffort: true },
  { id: 'gemini', name: 'Gemini', models: ['gemini-3.7-flash-high', 'gemini-3.1-pro-high', 'gemini-3.1-pro-low'], hint: 'Antigravity CLI · Google 계정' },
  { id: 'grok',   name: 'Grok',   models: ['grok-4.6', 'grok-4.5'], hint: 'Grok CLI · grok.com 구독' },
];

function pct(v) { return v == null ? '–' : Math.round(v * 100) + '%'; }
function esc(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

function msgNode(e) {
  const div = document.createElement('div');
  div.className = 'msg' + (e.author === 'You' ? ' you' : '');
  const who = document.createElement('div');
  who.className = 'who ' + e.author; who.textContent = e.author;
  if (e.author !== 'You' && MODELS[e.author]) {
    const model = document.createElement('span');
    model.className = 'model'; model.textContent = MODELS[e.author];
    who.append(model);
  }
  const body = document.createElement('div'); body.textContent = e.content;
  div.append(who, body);
  return div;
}

function traceNode(c) {
  const t = document.createElement('div'); t.className = 'trace';
  for (const b of c.barriers) {
    t.append(document.createTextNode(b.line + '\n'));
    for (const r of b.reasons || []) {
      const span = document.createElement('span'); span.className = 'reason';
      span.textContent = '↳ ' + r; t.append(span, document.createTextNode('\n'));
    }
  }
  t.append(document.createTextNode('stop=' + c.stop));
  return t;
}

// events shown when cycle k ends = sum over cycles 0..k of (1 human + granted barriers)
function cycleStop(cycles, k) {
  let n = 0;
  for (let i = 0; i <= k; i++) {
    n += 1 + cycles[i].barriers.filter(b => !b.line.endsWith('floor=none')).length;
  }
  return n;
}

function renderConversation(container, events, cycles) {
  container.innerHTML = '';
  let cycleIdx = 0, shown = 0;
  for (const e of events) {
    container.append(msgNode(e));
    shown++;
    if (cycleIdx < cycles.length && shown === cycleStop(cycles, cycleIdx)) {
      container.append(traceNode(cycles[cycleIdx])); cycleIdx++;
    }
  }
}

let seatsBuilt = false, lastModels = '';
function render(s) {
  MODELS = s.models || {};
  if (JSON.stringify(MODELS) !== lastModels) { lastModels = JSON.stringify(MODELS); lastCount = -1; }
  document.getElementById('who').textContent =
    s.roster.map(n => MODELS[n] ? n + '·' + MODELS[n] : n).join('  ') + ' — ' + s.provider;
  document.getElementById('file').textContent = s.transcript;
  if (!seatsBuilt) { buildSeats(s.roster); seatsBuilt = true; }
  if (s.events.length !== lastCount || s.cycles.length !== lastCycles) {
    lastCount = s.events.length; lastCycles = s.cycles.length;
    renderConversation(log, s.events, s.cycles);
    log.scrollTop = log.scrollHeight;
  }
  // roster options for directed speech
  const options = ['<option value="">전체에게</option>']
    .concat(s.roster.map(n => '<option value="' + n.toLowerCase() + '">' + n + '에게</option>'));
  if (target.dataset.roster !== s.roster.join()) {
    target.innerHTML = options.join(''); target.dataset.roster = s.roster.join();
  }
  // deliberation progress chips
  busy.classList.toggle('on', s.busy);
  stopBtn.classList.toggle('on', s.busy);
  if (s.busy) {
    const entries = Object.entries(s.progress || {});
    busy.innerHTML = entries.length
      ? entries.map(([who, st]) => '<span class="chip ' + esc(st) + '"><b class="who ' + esc(who) + '">' + esc(who) + '</b> ' + esc(st) + '</span>').join('')
      : '카운슬 심의 중…';
  }
  send.disabled = s.busy; text.disabled = s.busy;
  if (wasBusy && !s.busy) text.focus();
  wasBusy = s.busy;
  errBox.style.display = s.last_error ? 'block' : 'none';
  errBox.textContent = s.last_error || '';
  const m = s.metrics || {};
  document.getElementById('metrics').textContent =
    ' · PASS ' + pct(m.pass_rate) + ' · 동시요청 ' + pct(m.simultaneous_request_rate) +
    ' · 평점 ' + (m.naturalness_average == null ? '–' : m.naturalness_average.toFixed(1) +
    ' (' + m.naturalness_ratings.length + ')');
  const tbody = document.querySelector('#usage tbody');
  tbody.innerHTML = Object.entries(s.usage || {}).map(([who, u]) =>
    '<tr><td>' + esc(who) + '</td><td>' + u.calls + '</td><td>' + u.input_tokens.toLocaleString() +
    '</td><td>' + u.output_tokens.toLocaleString() + '</td><td>' + u.cost_usd.toFixed(3) + '</td></tr>').join('');
}

async function refresh() {
  try { render(await (await fetch('/api/state')).json()); } catch (_) {}
}
setInterval(refresh, 1500); refresh();

async function submit() {
  const value = text.value.trim();
  if (!value || send.disabled) return;
  text.value = '';
  busy.classList.add('on'); busy.textContent = '카운슬 심의 중…';
  send.disabled = true; text.disabled = true;
  const res = await fetch('/api/message', { method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ text: value, target: target.value || null }) });
  if (!res.ok) { errBox.style.display = 'block'; errBox.textContent = await res.text(); }
  refresh();
}
send.onclick = submit;
text.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); }
});
stopBtn.onclick = () => fetch('/api/stop', { method: 'POST' });

for (const b of document.querySelectorAll('#ratebar button')) {
  b.onclick = async () => {
    document.querySelectorAll('#ratebar button').forEach(x => x.classList.remove('sel'));
    b.classList.add('sel');
    await fetch('/api/rate', { method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ score: +b.dataset.s }) });
    refresh();
  };
}

// ----- settings drawer -----
function buildSeats(roster) {
  const box = document.getElementById('seats');
  box.innerHTML = '';
  for (const seat of SEATS) {
    const card = document.createElement('div'); card.className = 'seat'; card.id = 'seat-' + seat.id;
    const active = roster.includes(seat.name);
    card.innerHTML =
      '<div class="top"><span class="dot"></span>' +
      '<label style="display:flex;gap:6px;align-items:center;flex:1">' +
      '<input type="checkbox" class="join"' + (active ? ' checked' : '') + '> <b class="who ' + seat.name + '">' + seat.name + '</b></label>' +
      '<span class="hint status-text"></span></div>' +
      '<div class="hint">' + seat.hint + '</div>' +
      '<div class="row"><input type="text" class="model" list="models-' + seat.id + '" placeholder="모델 (비우면 기본값)">' +
      '<datalist id="models-' + seat.id + '">' + seat.models.map(m => '<option value="' + m + '">').join('') + '</datalist>' +
      '<select class="effort"' + (seat.noEffort ? ' disabled' : '') + '><option value="">effort 기본</option>' +
      '<option>low</option><option>medium</option><option>high</option></select></div>';
    box.append(card);
  }
}

async function refreshProviders() {
  try {
    const statuses = await (await fetch('/api/providers')).json();
    for (const st of statuses) {
      const seat = SEATS.find(x => x.name === st.agent); if (!seat) continue;
      const card = document.getElementById('seat-' + seat.id); if (!card) continue;
      card.querySelector('.dot').className = 'dot ' + (st.ok ? 'ok' : 'bad');
      card.querySelector('.status-text').textContent = st.ok ? '로그인됨' : '미인증';
      const join = card.querySelector('.join');
      if (!st.ok) { join.checked = false; join.disabled = true; card.title = st.error || ''; }
      else { join.disabled = false; }
    }
  } catch (_) {}
}

document.getElementById('gear').onclick = () => {
  histdrawer.classList.remove('open');
  settings.classList.toggle('open');
  if (settings.classList.contains('open')) refreshProviders();
};

document.getElementById('apply').onclick = async () => {
  const seats = [];
  for (const seat of SEATS) {
    const card = document.getElementById('seat-' + seat.id);
    if (!card.querySelector('.join').checked) continue;
    seats.push({ agent: seat.id, model: card.querySelector('.model').value.trim() || null,
                 effort: card.querySelector('.effort').value || null });
  }
  if (seats.length < 2) { alert('AI를 2명 이상 선택하세요.'); return; }
  if (lastCount > 0 && !confirm('현재 대화를 버리고 새 세션을 시작할까요? (transcript는 저장되어 있음)')) return;
  const res = await fetch('/api/session', { method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ seats, max_ai_streak: +document.getElementById('streak').value || 3 }) });
  if (!res.ok) { errBox.style.display = 'block'; errBox.textContent = await res.text(); return; }
  settings.classList.remove('open');
  lastCount = -1; refresh();
};

document.getElementById('budget-apply').onclick = async () => {
  await fetch('/api/budget', { method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ max_cost_usd: +document.getElementById('budget-cost').value || 0,
                           max_total_tokens: +document.getElementById('budget-tokens').value || 0 }) });
  refresh();
};

// ----- history drawer + viewer -----
async function refreshSessions() {
  const box = document.getElementById('sessions');
  box.innerHTML = '<div class="hint">불러오는 중…</div>';
  try {
    const sessions = await (await fetch('/api/sessions')).json();
    box.innerHTML = sessions.length ? '' : '<div class="hint">저장된 세션이 없다.</div>';
    for (const s of sessions) {
      const div = document.createElement('div'); div.className = 'session';
      const when = new Date(s.saved_unix * 1000).toLocaleString('ko-KR');
      div.innerHTML = '<div class="name">' + esc(s.first_line || '(비어 있음)') + '</div>' +
        '<div class="sub">' + when + ' · 이벤트 ' + s.events + '개 · ' + esc(s.file) + '</div>';
      div.onclick = () => openViewer(s.file);
      box.append(div);
    }
  } catch (_) { box.innerHTML = '<div class="hint">목록을 불러오지 못했다.</div>'; }
}

async function openViewer(file) {
  try {
    const record = await (await fetch('/api/session_view?file=' + encodeURIComponent(file))).json();
    viewerFile = file;
    document.getElementById('viewer-name').textContent =
      file + ' — ' + (record.roster || []).join(' · ');
    renderConversation(document.getElementById('viewer-log'), record.events || [], record.cycles || []);
    viewer.classList.add('open');
  } catch (_) {}
}

document.getElementById('history').onclick = () => {
  settings.classList.remove('open');
  histdrawer.classList.toggle('open');
  if (histdrawer.classList.contains('open')) refreshSessions();
};
document.getElementById('viewer-close').onclick = () => viewer.classList.remove('open');
document.getElementById('resume').onclick = async () => {
  if (!viewerFile) return;
  if (!confirm('이 대화를 현재 참가자 구성으로 이어갈까요? 진행 중이던 방은 새 방으로 교체됩니다.')) return;
  const res = await fetch('/api/resume', { method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ file: viewerFile }) });
  if (!res.ok) { errBox.style.display = 'block'; errBox.textContent = await res.text(); return; }
  viewer.classList.remove('open'); histdrawer.classList.remove('open');
  lastCount = -1; refresh();
};
</script>
</body>
</html>
